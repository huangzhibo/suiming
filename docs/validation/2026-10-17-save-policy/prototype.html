<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Suiming · 保存时机隔离实验</title>
<style>
:root{--foreground:#202126;--primary:#397cf6;--primary-selection:#d9e7ff;--purple:#8052c7;--faint:#92939e;--page-gutter:24px;font:14px system-ui;color:var(--foreground);background:#fff}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #e7e7ec}strong{font-size:20px}small{display:block;color:#73747f;margin-top:6px}select,button{font:inherit;border:1px solid #dedee5;background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{background:#f3f6fb}button:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}button:disabled{opacity:.5;cursor:default}main{display:grid;grid-template-columns:190px minmax(280px,1fr) 290px;height:calc(100vh - 135px);min-height:480px}aside{padding:16px;background:#fafafa}h2{font-size:14px;margin:0 0 16px}p{color:#73747f;font-size:13px;line-height:1.7}.file-row{display:flex;align-items:center;gap:5px;margin-bottom:10px}.file-row button{border:0;text-align:left;flex:1}.file-row button[aria-pressed=true]{background:#edf3ff;color:#276bdc}.document{min-width:0;display:flex;flex-direction:column;border-inline:1px solid #e7e7ec}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px;border-bottom:1px solid #eee}.toolbar span{overflow-wrap:anywhere;font-size:12px;color:#73747f}.editor{flex:1;min-height:0}.editor[hidden]{display:none}.agent button{display:block;width:100%;margin:10px 0}.primary{background:#397cf6!important;color:white;border-color:#397cf6}details{margin-top:18px;font-size:13px}summary{cursor:pointer}pre{white-space:pre-wrap;font:12px/1.6 system-ui;overflow-wrap:anywhere}li{margin-bottom:8px}footer{padding:14px 24px;border-top:1px solid #e7e7ec;font-size:13px;min-height:48px}.cm-host{overflow:auto}@media(max-width:850px){main{grid-template-columns:155px minmax(250px,1fr)}.agent{grid-column:1/-1;border-top:1px solid #eee}main{height:auto}.document{min-height:380px}.agent button{display:inline-block;width:auto;margin-right:8px}footer{position:sticky;bottom:0;background:white}}
